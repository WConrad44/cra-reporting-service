name: Deployed self-validation

# Destructive evaluation resets target data; run only when coordinated.
on:
  workflow_dispatch:
    inputs:
      tester_host:
        description: "Run Team 21's unchanged tester on GitHub (diagnostic) or Render"
        required: true
        type: choice
        default: github-runner
        options:
          - github-runner
          - render-hosted

concurrency:
  group: pod-k-deployed-validation
  cancel-in-progress: false

jobs:
  deployed-self:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_API_TOKEN: ${{ secrets.TEAM21_API_TOKEN }}
      TESTER_HOST: ${{ inputs.tester_host }}
    steps:
      - name: Wait for Team 21 Phase 5 deployments
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request
          for label, url, expected in [
              ("system", "https://team21-cra-reporting-service.onrender.com/openapi.json", "0.5.0"),
              ("tester", "https://cra-phase3-tester.onrender.com/openapi.json", "0.5.0"),
          ]:
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          data = json.load(response)
                      version = data.get("info", {}).get("version")
                      print(f"{label}: {version}")
                      if version == expected:
                          break
                  except Exception as exc:
                      print(f"{label} attempt {attempt + 1}: {exc}")
                  time.sleep(10)
              else:
                  raise SystemExit(f"{label} did not reach Phase 5")
          PY

      # The GitHub-hosted option runs the exact same Team 21 tester source
      # against the same deployed system, but moves client-side decompression,
      # request orchestration, and JSON handling off Render's Free tester CPU.
      # It is distinct evidence from running the deployed Render tester.
      - name: Check out Team 21 tester source
        if: inputs.tester_host == 'github-runner'
        uses: actions/checkout@v4

      - name: Set up Python for GitHub-hosted tester
        if: inputs.tester_host == 'github-runner'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Team 21 tester dependencies
        if: inputs.tester_host == 'github-runner'
        run: python -m pip install -r requirements.txt

      - name: Start Team 21 tester on the GitHub runner
        if: inputs.tester_host == 'github-runner'
        shell: bash
        run: |
          if [ -z "$TARGET_API_TOKEN" ]; then
            echo "TEAM21_API_TOKEN must be configured in GitHub Actions secrets."
            exit 1
          fi
          nohup python -m uvicorn tester.main:app --host 127.0.0.1 --port 8765 \
            > "$RUNNER_TEMP/team21-tester.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8765/health >/dev/null; then
              echo "Team 21 tester is ready on the GitHub runner."
              exit 0
            fi
            sleep 1
          done
          echo "Tester did not start; see logs."
          cat "$RUNNER_TEMP/team21-tester.log"
          exit 1

      - name: Team 21 tester against Team 21 deployed system (problem+json parser rerun)
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request

          import os
          tester = (
              "http://127.0.0.1:8765"
              if os.environ.get("TESTER_HOST") == "github-runner"
              else "https://cra-phase3-tester.onrender.com"
          )
          target = "https://team21-cra-reporting-service.onrender.com"
          print(f"Team 21 tester execution host: {os.environ['TESTER_HOST']}", flush=True)
          print(f"Target deployed system: {target}", flush=True)

          def post(path, body):
              req = urllib.request.Request(
                  tester + path,
                  data=json.dumps(body).encode(),
                  method="POST",
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=1200) as response:
                  return json.load(response)

          setup = post("/test/setup", {"target_url": target})
          report = post("/test/run", {"session_id": setup["session_id"]})
          report["tester_execution_host"] = os.environ.get("TESTER_HOST", "unspecified")
          open("team21-self.json", "w").write(json.dumps(report, indent=2))

          counts = {}
          for result in report.get("results", []):
              outcome = result.get("outcome", "unknown")
              counts[outcome] = counts.get(outcome, 0) + 1
          print("Team 21 self-validation:", counts)
          for result in report.get("results", []):
              if result.get("outcome") != "pass":
                  print(result)
          expected_ids = {f"AC-{number:02d}" for number in range(1, 19)}
          observed_ids = [result.get("test_id") for result in report.get("results", [])]
          required_coverage = {"code", "component", "system", "model"}
          if (
              len(observed_ids) != 18
              or set(observed_ids) != expected_ids
              or counts != {"pass": 18}
              or not required_coverage.issubset(report.get("coverage", {}))
          ):
              raise SystemExit("Deployed self-validation FAILED; see the uploaded report.")
          PY

      - name: Upload deployed self report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-self-report
          path: team21-self.json
          if-no-files-found: warn
